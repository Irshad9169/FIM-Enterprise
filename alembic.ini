[alembic]
# Path to migration scripts. app/db/migrations rather than a top-level
# alembic/ dir so it sits alongside the rest of the app package.
script_location = app/db/migrations

# Timestamped revision filenames for readability in `git log`/directory
# listings; the actual revision id is still what chains migrations together.
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s

prepend_sys_path = .

# sqlalchemy.url is intentionally left blank here — env.py sets it from
# app.core.config.settings.database_url at runtime, the same source of
# truth the app itself uses, instead of duplicating it in this file.
sqlalchemy.url =

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
