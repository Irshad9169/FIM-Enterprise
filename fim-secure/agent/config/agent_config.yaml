  name: test06-agent
agent_id: 18873e0c-5636-44cd-a13f-b4f5753e6484
logging:
  backup_count: 5
  file: /var/log/fim-agent.log
  level: INFO
  max_size: 10485760
monitoring:
  hash_algorithm: sha256
  heartbeat_interval: 60
  scan_time: "02:00"        # NEW — fixed daily scan at 2:00 AM local
  # scan_interval: 3600     # OLD — can keep as fallback, ignored when scan_time is set
  heartbeat_interval: 60
  paths:
  - exclude_patterns:
    - '*.tmp'
    - '*.swp'
    - .git/*
    path: /etc
    recursive: true
  - exclude_patterns:
    - '*.log'
    - cache/*
    path: /var/www
    recursive: true
  - exclude_patterns:
    - '*.pyc'
    - __pycache__/*
    - fim*       # Exclude FIM app itself
    - IBM*       # Exclude IBM app
    - EMPsysedge*
    path: /opt
    recursive: true
performance:
  batch_size: 1000
  max_memory: 512
  max_workers: 4
server:
  api_key: api_key: "+ENC++gAAAAABqJrh8k--QtJeSbHG8qSJ6ydTt_kn2INLBVoNA3QOCmjeWFCecXrjZrDRC1PkOgnCk--QjJNSDH2uITJW_RaDn1Pirx7VwEa779cyg2vnZqfOVYKZvTvnkwbZ-TTOahGNIH6iq"
  api_version: v1
  retry_attempts: 3
  retry_delay: 5
  timeout: 30
  url: http://localhost:8000
