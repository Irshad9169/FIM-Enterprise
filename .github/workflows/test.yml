name: Backend tests

on:
  push:
    branches: ["main", "feature/**"]
  pull_request:
    branches: ["main"]
  workflow_dispatch: {} # lets you manually re-run the frontend build below without a new commit

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      DATABASE_URL: "postgresql+asyncpg://test:test@localhost/test_db"
      SECRET_KEY: "ci-dummy-secret-not-used-for-anything-real"
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run ruff
        # continue-on-error: this is the first lint pass ever added to a
        # codebase with no prior linting — informational for now rather
        # than blocking, until real violation counts are known and either
        # fixed or deliberately ignored. Flip this off once that triage
        # has happened.
        continue-on-error: true
        run: ruff check . --output-format=full

  unit:
    name: Unit tests (no database)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      # app/core/config.py's Settings() is instantiated at import time
      # (via app/core/__init__.py) and requires these two fields with no
      # defaults. No real database or secret is needed for these unit
      # tests — they're dummy values purely so Settings() can construct.
      DATABASE_URL: "postgresql+asyncpg://test:test@localhost/test_db"
      SECRET_KEY: "ci-dummy-secret-not-used-for-anything-real"
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run unit tests
        run: pytest -v -m "not integration"

  integration:
    name: Integration tests (real throwaway Postgres)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: fim_test
          POSTGRES_PASSWORD: fim_test_password
          POSTGRES_DB: fim_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      # Points at the ephemeral Postgres service container above — created
      # fresh every run via Base.metadata.create_all() in
      # tests/integration/conftest.py, never a dump of any real database.
      DATABASE_URL: "postgresql+asyncpg://fim_test:fim_test_password@localhost:5432/fim_test"
      SECRET_KEY: "ci-dummy-secret-not-used-for-anything-real"
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run integration tests
        run: pytest -v -m integration tests/integration

  frontend-build:
    name: Build frontend (downloadable artifact for deploy)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # This exists because at least one deployment target (test06) has a
    # system glibc too old for current Rollup's native binary — no version
    # of the musl workaround got Rollup to actually use it (its platform
    # detection deterministically reaches for the glibc-linked binary by
    # name once it detects a glibc host, regardless of what else is
    # installed). Building here on a current Ubuntu runner sidesteps that
    # entirely: nginx only needs the resulting static web/ directory, it
    # doesn't care what machine produced it.
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        working-directory: frontend
        run: npm install --legacy-peer-deps

      - name: Build
        working-directory: frontend
        run: npm run build

      - name: Upload web/ as a downloadable artifact
        uses: actions/upload-artifact@v4
        with:
          name: fim-frontend-web
          path: web/
          retention-days: 14
