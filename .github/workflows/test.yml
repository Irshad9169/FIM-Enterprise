name: Backend tests

on:
  push:
    branches: ["main", "feature/**"]
  pull_request:
    branches: ["main"]

jobs:
  unit:
    name: Unit tests (no database)
    runs-on: ubuntu-latest
    env:
      # app/core/config.py's Settings() is instantiated at import time
      # (via app/core/__init__.py) and requires these two fields with no
      # defaults. No real database or secret is needed for these unit
      # tests — they're dummy values purely so Settings() can construct.
      DATABASE_URL: "postgresql+asyncpg://test:test@localhost/test_db"
      SECRET_KEY: "ci-dummy-secret-not-used-for-anything-real"
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run unit tests
        run: pytest -v -m "not integration"

  integration:
    name: Integration tests (real throwaway Postgres)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: fim_test
          POSTGRES_PASSWORD: fim_test_password
          POSTGRES_DB: fim_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      # Points at the ephemeral Postgres service container above — created
      # fresh every run via Base.metadata.create_all() in
      # tests/integration/conftest.py, never a dump of any real database.
      DATABASE_URL: "postgresql+asyncpg://fim_test:fim_test_password@localhost:5432/fim_test"
      SECRET_KEY: "ci-dummy-secret-not-used-for-anything-real"
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run integration tests
        run: pytest -v -m integration tests/integration
